    <script>
      (function () {
        try {
          var pref = localStorage.getItem("br-theme") || "system";
          var query = new URLSearchParams(location.search).get("theme");
          if (query === "system" || query === "dark" || query === "light") {
            pref = query;
          }
          if (pref !== "system" && pref !== "dark" && pref !== "light") {
            pref = "system";
          }
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = pref === "dark" || (pref !== "light" && dark) ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePref = pref;
          var color = theme === "dark" ? "#0B0C0E" : "#F4F2EC";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", color);

          var locale = localStorage.getItem("br-locale");
          var langQuery = new URLSearchParams(location.search).get("lang");
          if (langQuery === "zh" || langQuery === "en") locale = langQuery;
          if (locale !== "zh" && locale !== "en") {
            var nav = (navigator.language || "").toLowerCase();
            locale = nav.indexOf("zh") === 0 ? "zh" : "en";
          }
          document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
          document.documentElement.dataset.locale = locale;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.themePref = "system";
          document.documentElement.lang = "zh-CN";
          document.documentElement.dataset.locale = "zh";
        }
      })();
    </script>
