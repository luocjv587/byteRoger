<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0b0c0e;
        color: #e8e6e1;
        font-family: ui-sans-serif, system-ui, "PingFang SC", "Hiragino Sans GB",
          sans-serif;
      }
      .card {
        position: relative;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        background-image:
          linear-gradient(rgba(232, 230, 225, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(232, 230, 225, 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .meta {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #6e6b64;
      }
      h1 {
        margin: 28px 0 20px;
        font-size: 112px;
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 0.92;
      }
      .lead {
        font-size: 32px;
        color: #a8a59c;
      }
      .ai {
        margin-top: 10px;
        font-size: 28px;
        color: #7dffd3;
      }
      .url {
        position: absolute;
        right: 80px;
        bottom: 64px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 20px;
        letter-spacing: 0.08em;
        color: #6e6b64;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="meta">Independent developer · 个人开发者</p>
      <h1>ByteRoger</h1>
      <p class="lead">科技让生活更美好</p>
      <p class="ai">拥抱 AI · Embrace AI</p>
      <p class="url">zecrs.com</p>
    </div>
  </body>
</html>
